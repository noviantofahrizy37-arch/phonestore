<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - NoPPhone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Tambahan style untuk kondisi kosong */
        .empty-cart-wrapper {
            text-align: center;
            padding: 50px 20px;
            width: 100%;
        }
        .empty-cart-wrapper img {
            width: 150px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .empty-cart-wrapper p {
            font-size: 18px;
            color: #888;
        }
        /* Memastikan cart-container tetap rapi */
        .cart-section {
            display: flex;
            gap: 30px;
            padding: 40px 5%;
            min-height: 60vh;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <span class="logo">NoPPhone</span>

        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="#brands">Brands</a>
            <a href="#products">Products</a>
            <a href="#features">Features</a>
            <a href="#contact">Contact</a>
        </nav>

        <div class="header-actions">
            <button class="action-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                Search
            </button>

            <button class="action-btn" onclick="window.location.href='account_page.html'">
                My Account
            </button>

            <button class="icon-btn" onclick="window.location.href='cart.html'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <path d="M16 10a4 4 0 01-8 0" />
                </svg>
            </button>
        </div>
    </div>
</header>

    <section class="cart-section" id="mainCartContainer">
        <div class="cart-left" id="cartItemsList">
            </div>

        <div class="cart-right" id="cartSummary">
            <h2>Order Summary</h2>
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotalPrice">Rp 0</span>
            </div>
            <div class="summary-row">
                <span>Shipping</span>
                <span>Free</span>
            </div>
            <div class="summary-row total">
                <span>Total</span>
                <span id="totalPrice">Rp 0</span>
            </div>
            <button class="checkout-btn" onclick="processCheckout()">Proceed to Checkout</button>
            <button class="continue-btn" onclick="window.location.href='all_products.html'">Continue Shopping</button>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-bottom">
            <p>Created by Novan.S.Gpt.Ytb</p>
        </div>
    </footer>

    <script>
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('gadgetCart')) || [];
            const itemsContainer = document.getElementById('cartItemsList');
            const summaryContainer = document.getElementById('cartSummary');
            const subtotalEl = document.getElementById('subtotalPrice');
            const totalEl = document.getElementById('totalPrice');

            // 1. Logika Jika Keranjang Kosong
            if (cart.length === 0) {
                itemsContainer.innerHTML = `
                    <div class="empty-cart-wrapper">
                        <img src="imag/cart icon.png" alt="Empty Cart">
                        <p>Keranjang belanja Anda masih kosong.</p>
                        <br>
                        <a href="all_products.html" class="continue-btn" style="display:inline-block; text-decoration:none;">Mulai Belanja</a>
                    </div>
                `;
                summaryContainer.style.display = 'none'; // Sembunyikan ringkasan jika kosong
                return;
            }

            // 2. Logika Jika Ada Item
            summaryContainer.style.display = 'block';
            itemsContainer.innerHTML = '';
            let totalHarga = 0;

            cart.forEach((item, index) => {
                const subtotal = item.price * item.quantity;
                totalHarga += subtotal;

                itemsContainer.innerHTML += `
                    <div class="cart-item">
                        <div class="product-info">
                            <img src="${item.img}" alt="${item.name}">
                            <div class="product-details">
                                <h3>${item.name}</h3>
                                <p>Premium Selection</p>
                            </div>
                        </div>
                        <div class="quantity">
                            <button onclick="updateQty(${index}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="updateQty(${index}, 1)">+</button>
                        </div>
                        <div class="price">Rp ${subtotal.toLocaleString('id-ID')}</div>
                        <button class="remove" onclick="deleteItem(${index})">×</button>
                    </div>
                `;
            });

            // Update Total di UI
            subtotalEl.innerText = `Rp ${totalHarga.toLocaleString('id-ID')}`;
            totalEl.innerText = `Rp ${totalHarga.toLocaleString('id-ID')}`;
        }

        // Fungsi Update Jumlah
        function updateQty(index, change) {
            let cart = JSON.parse(localStorage.getItem('gadgetCart'));
            cart[index].quantity += change;
            if (cart[index].quantity < 1) cart[index].quantity = 1;
            localStorage.setItem('gadgetCart', JSON.stringify(cart));
            renderCart();
        }

        // Fungsi Hapus Item
        function deleteItem(index) {
            let cart = JSON.parse(localStorage.getItem('gadgetCart'));
            cart.splice(index, 1);
            localStorage.setItem('gadgetCart', JSON.stringify(cart));
            renderCart();
        }


        // Fungsi Checkout yang diperbarui agar tersambung ke Halaman Akun
function processCheckout() {
    // 1. Ambil data keranjang saat ini
    const cart = JSON.parse(localStorage.getItem('gadgetCart')) || [];

    // Cek jika keranjang kosong
    if (cart.length === 0) {
        alert("Keranjang Anda kosong!");
        return;
    }

    // 2. Buat objek pesanan baru
    const newOrder = {
        orderId: Math.floor(Math.random() * 1000000), // Generate ID acak
        date: new Date().toLocaleString('id-ID', { 
            day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' 
        }),
        items: cart,
        total: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0)
    };

    // 3. Ambil riwayat lama, tambahkan yang baru, lalu simpan kembali
    let history = JSON.parse(localStorage.getItem('orderHistory')) || [];
    history.push(newOrder);
    localStorage.setItem('orderHistory', JSON.stringify(history));

    // 4. Berikan feedback, hapus keranjang, dan pindah ke halaman akun
    alert("Terima kasih! Pesanan Anda berhasil disimpan.");
    localStorage.removeItem('gadgetCart');
    window.location.href = "account_page.html"; 
}

        // Jalankan saat halaman dimuat
        window.onload = renderCart;
    </script>
</body>
</html>
