<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NopPhone — Minimalist Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --white: #ffffff;
    --off-white: #f5f5f0;
    --gray-dark: #1a1a1a;
    --gray-mid: #4a4a4a;
    --gray-light: #c8c8c8;
    --gray-ultra-light: #e8e8e3;
    --accent: #ffffff; /* Aksen Putih */
    --accent-dim: rgba(255, 255, 255, 0.15);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Golos Text', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── ANIMATED BACKGROUND ── */
  .bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .bg-canvas::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 60% at 20% 50%, rgba(255,255,255,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 20%, rgba(255,255,255,0.03) 0%, transparent 55%),
      radial-gradient(ellipse 40% 40% at 60% 80%, rgba(255,255,255,0.04) 0%, transparent 50%);
    animation: bgShift 12s ease-in-out infinite alternate;
  }

  @keyframes bgShift {
    0% { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.05) translate(-1%, 1%); }
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), rgba(255,255,255,0.15), rgba(255,255,255,0.3), transparent);
    animation: scanDown 8s linear infinite;
  }

  @keyframes scanDown {
    0% { top: -1px; }
    100% { top: 100%; }
  }

  /* ── LAYOUT ── */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .left-panel {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px 64px;
    border-right: 1px solid rgba(255,255,255,0.08);
    position: relative;
    opacity: 0;
    transform: translateX(-40px);
    animation: slideInLeft 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
  }

  @keyframes slideInLeft { to { opacity: 1; transform: translateX(0); } }

  .brand-eyebrow {
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--white);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-eyebrow::before {
    content: '';
    width: 32px;
    height: 1px;
    background: var(--white);
  }

  .brand-name {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(36px, 4vw, 56px);
    font-weight: 700;
    letter-spacing: 0.12em;
    line-height: 1;
    color: var(--white);
    margin-bottom: 8px;
  }
  .brand-name span { color: var(--gray-light); }

  .brand-tagline {
    font-size: clamp(14px, 1.5vw, 18px);
    color: var(--gray-light);
    font-weight: 300;
    letter-spacing: 0.05em;
    margin-bottom: 48px;
  }

  /* Phone showcase */
  .phone-frame {
    position: relative;
    width: 220px;
    animation: phoneFloat 6s ease-in-out infinite;
  }
  @keyframes phoneFloat {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-16px) rotate(2deg); }
  }

  .phone-body {
    width: 220px;
    height: 440px;
    border-radius: 36px;
    border: 1.5px solid rgba(255,255,255,0.2);
    background: linear-gradient(145deg, #1a1a1a 0%, #0d0d0d 50%, #1f1f1f 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ── RIGHT PANEL ── */
  .right-panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 64px;
    opacity: 0;
    transform: translateX(40px);
    animation: slideInRight 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
  }
  @keyframes slideInRight { to { opacity: 1; transform: translateX(0); } }

  /* ── TABS ── */
  .auth-tabs {
    display: flex;
    margin-bottom: 48px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .tab-btn {
    background: none; border: none;
    color: var(--gray-mid);
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 0 0 16px 0;
    margin-right: 40px;
    cursor: pointer;
    position: relative;
    transition: color 0.3s;
  }

  .tab-btn.active { color: var(--white); }
  .tab-btn.active::after {
    content: ''; position: absolute; bottom: -1px; left: 0;
    width: 100%; height: 1px; background: var(--white);
  }

  /* ── FORM ELEMENTS (REVERTED TO ORIGINAL) ── */
  .form-panel { display: none; }
  .form-panel.active { display: block; animation: formReveal 0.5s ease forwards; }
  @keyframes formReveal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .form-heading {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(28px, 3vw, 42px);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .form-heading em { font-style: italic; color: var(--gray-light); }

  .field-group { display: flex; flex-direction: column; gap: 20px; margin-bottom: 32px; }
  .field { position: relative; }

  .field-label {
    display: block; font-size: 9px; letter-spacing: 0.35em;
    color: var(--gray-mid); text-transform: uppercase; margin-bottom: 10px;
  }

  .field-input {
    width: 100%; background: transparent; border: none;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    padding: 10px 0; color: var(--white);
    font-family: 'Golos Text', sans-serif; font-size: 15px; outline: none;
  }

  .field-line {
    position: absolute; bottom: 0; left: 0; width: 0; height: 1px;
    background: var(--white); transition: width 0.4s ease;
  }
  .field:focus-within .field-line { width: 100%; }

  .btn-submit {
    width: 100%; background: var(--white); color: var(--black);
    border: none; padding: 18px 32px; font-family: 'Poppins', sans-serif;
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    cursor: pointer; margin-top: 32px; transition: transform 0.2s;
  }
  .btn-submit:hover { transform: translateY(-1px); opacity: 0.9; }

  /* Utilities */
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .divider { display: flex; align-items: center; gap: 16px; margin: 24px 0; font-size: 10px; color: var(--gray-mid); }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.08); }

  .btn-social {
    flex: 1; background: transparent; border: 1px solid rgba(255,255,255,0.1);
    color: var(--white); padding: 13px; font-size: 12px; cursor: pointer;
  }

  @media (max-width: 768px) {
    .page { grid-template-columns: 1fr; }
    .left-panel { display: none; }
    .right-panel { padding: 48px 32px; }
  }
</style>
</head>
<body>

<div class="bg-canvas">
  <div class="bg-grid"></div>
  <div class="scan-line"></div>
</div>

<div class="page">
  <div class="left-panel">
    <div class="brand-block">
      <div class="brand-eyebrow">Curated Excellence</div>
      <div class="brand-name">NOP<span>PHONE</span></div>
      <div class="brand-tagline">Where Prestige Meets Technology</div>
    </div>

    <div class="phone-showcase">
      <div class="phone-frame">
        <div class="phone-body">
          <div style="font-family: 'Poppins'; font-size: 40px;">○</div>
          <div style="font-size: 9px; letter-spacing: 0.3em; color: rgba(255,255,255,0.5);">Premium Series</div>
        </div>
      </div>
    </div>

    <div class="brand-partners">
      <div style="font-size: 9px; color: var(--gray-mid); letter-spacing: 0.35em;">OFFICIAL PARTNERS</div>
      <div style="display: flex; gap: 20px; font-size: 10px; opacity: 0.3; margin-top: 10px;">
        <span>APPLE</span> <span>SAMSUNG</span> <span>SONY</span> <span>GOOGLE</span>
      </div>
    </div>
  </div>

  <div class="right-panel">
    <div class="auth-tabs">
      <button class="tab-btn active" id="btn-tab-login" onclick="switchTab('login')">Masuk</button>
      <button class="tab-btn" id="btn-tab-register" onclick="switchTab('register')">Daftar</button>
    </div>

    <div class="form-panel active" id="panel-login">
      <div class="form-heading">Selamat <em>Kembali.</em></div>
      <p style="color: var(--gray-mid); font-size: 13px; margin-bottom: 40px;">Akses eksklusif ke koleksi premium Anda.</p>

      <div class="field-group">
        <div class="field">
          <label class="field-label">Alamat Email</label>
          <input class="field-input" type="email" id="login-email" placeholder="nama@email.com">
          <div class="field-line"></div>
        </div>
        <div class="field">
          <label class="field-label">Kata Sandi</label>
          <input class="field-input" type="password" id="login-pass" placeholder="••••••••">
          <div class="field-line"></div>
        </div>
      </div>

      <button class="btn-submit" onclick="handleLogin()">Masuk ke Akun</button>
      <div class="divider"><span>atau lanjutkan dengan</span></div>
      <div style="display: flex; gap: 12px;">
        <button class="btn-social">Google</button>
        <button class="btn-social">Apple</button>
      </div>
    </div>

    <div class="form-panel" id="panel-register">
      <div class="form-heading">Bergabung <em>Bersama Kami.</em></div>
      <p style="color: var(--gray-mid); font-size: 13px; margin-bottom: 40px;">Daftarkan diri Anda dan nikmati pengalaman premium.</p>

      <div class="field-group">
        <div class="field-row">
          <div class="field">
            <label class="field-label">Nama Depan</label>
            <input class="field-input" type="text" placeholder="Arya">
            <div class="field-line"></div>
          </div>
          <div class="field">
            <label class="field-label">Nama Belakang</label>
            <input class="field-input" type="text" placeholder="Wijaya">
            <div class="field-line"></div>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Alamat Email</label>
          <input class="field-input" type="email" id="reg-email" placeholder="nama@email.com">
          <div class="field-line"></div>
        </div>
        <div class="field">
          <label class="field-label">Kata Sandi</label>
          <input class="field-input" type="password" id="reg-pass" placeholder="Min. 8 karakter">
          <div class="field-line"></div>
        </div>
      </div>

      <button class="btn-submit" onclick="handleRegister()">Buat Akun Premium</button>
      <div class="divider"><span>atau daftar dengan</span></div>
      <div style="display: flex; gap: 12px;">
        <button class="btn-social">Google</button>
        <button class="btn-social">Apple</button>
      </div>
    </div>
  </div>
</div>

<script>
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
    
    // Mencari tombol berdasarkan id yang ditambahkan agar lebih akurat
    document.getElementById(`btn-tab-${tab}`).classList.add('active');
    document.getElementById(`panel-${tab}`).classList.add('active');
  }

  // Logika Pendaftaran
  function handleRegister() {
    const email = document.getElementById('reg-email').value;
    const pass = document.getElementById('reg-pass').value;

    if (email && pass) {
      // Simpan data ke browser sementara (localStorage)
      localStorage.setItem('nopUserEmail', email);
      localStorage.setItem('nopUserPass', pass);
      
      alert("Pendaftaran Berhasil! Silakan masuk dengan akun Anda.");
      
      // Pindah ke tab login
      switchTab('login');
      
      // Isi otomatis input email di form login untuk kemudahan user
      document.getElementById('login-email').value = email;
    } else {
      alert("Harap isi email dan kata sandi.");
    }
  }

  // Logika Login
  function handleLogin() {
    const emailInput = document.getElementById('login-email').value;
    const passInput = document.getElementById('login-pass').value;

    const savedEmail = localStorage.getItem('nopUserEmail');
    const savedPass = localStorage.getItem('nopUserPass');

    // Cek apakah data input cocok dengan data yang disimpan saat daftar
    if (emailInput === savedEmail && passInput === savedPass && savedEmail !== null) {
      alert("Login Berhasil! Mengalihkan ke halaman utama...");
      window.location.href = "index.html"; // Mengarah ke file index.html Anda
    } else {
      alert("Email atau Kata Sandi salah / belum terdaftar.");
    }
  }
</script>
</body>
</html>
